# Approved manual synthetic acceptance only. Use identical bytes on the release branch.
name: Top 10 synthetic research
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Approved synthetic acceptance scenario
        required: true
        type: choice
        options: [success, cancel]
      deadline_utc:
        description: Approved absolute UTC deadline (ISO 8601, Z)
        required: true
        type: string
permissions: {}
concurrency:
  group: top10-synthetic-monitor
  cancel-in-progress: false
jobs:
  research:
    if: >-
      ${{ github.repository == 'mstinkureddy/Market-Research-Monitor' &&
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'mstinkureddy' && github.run_attempt == '1' &&
          github.ref == 'refs/heads/top10-synthetic-approved' &&
          github.ref_protected && github.workflow_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.scenario == 'cancel' && 3 || 20 }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Approved run and synthetic research
        if: ${{ inputs.scenario == 'success' }}
        env:
          MONITOR_GITHUB_TOKEN: ${{ github.token }}
          MONITOR_DEADLINE_UTC: ${{ inputs.deadline_utc }}
          MONITOR_SCENARIO: ${{ inputs.scenario }}
        run: exec python3 -B -m monitor_top10.actions.runner --github
      - name: Test B ARMED
        if: ${{ success() && inputs.scenario == 'cancel' }}
        env:
          MONITOR_GITHUB_TOKEN: ${{ github.token }}
          MONITOR_DEADLINE_UTC: ${{ inputs.deadline_utc }}
          MONITOR_SCENARIO: ${{ inputs.scenario }}
        run: exec python3 -B -m monitor_top10.actions.cancel_probe armed
      - name: Test B SIGNED OFF
        if: ${{ success() && inputs.scenario == 'cancel' }}
        env:
          MONITOR_GITHUB_TOKEN: ${{ github.token }}
          MONITOR_DEADLINE_UTC: ${{ inputs.deadline_utc }}
          MONITOR_SCENARIO: ${{ inputs.scenario }}
        run: exec python3 -B -m monitor_top10.actions.cancel_probe off
      - name: Test B CANCELLATION WINDOW
        if: ${{ success() && inputs.scenario == 'cancel' }}
        env:
          MONITOR_DEADLINE_UTC: ${{ inputs.deadline_utc }}
          MONITOR_SCENARIO: ${{ inputs.scenario }}
        run: exec python3 -B -m monitor_top10.actions.cancel_probe idle
      - name: Research report artifact
        if: ${{ success() && inputs.scenario == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: top10-synthetic-research
          path: _monitor/report.json
          retention-days: 1
          if-no-files-found: error
